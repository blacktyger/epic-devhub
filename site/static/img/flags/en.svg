<!--
  Union Jack on the standard 60x30 construction. The clip path is what counterchanges the
  red diagonals so each one hugs the correct side of the white saltire; without it the red
  sits centred and the flag reads as a mirror image of itself.

  English is flagged GB rather than US because this corpus is written in British English.
  Changing it is this file plus nothing else.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 30" role="img" aria-hidden="true">
  <clipPath id="uj-counterchange">
    <path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/>
  </clipPath>
  <rect width="60" height="30" fill="#012169"/>
  <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/>
  <path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#uj-counterchange)" stroke="#c8102e" stroke-width="4"/>
  <path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/>
  <path d="M30,0 v30 M0,15 h60" stroke="#c8102e" stroke-width="6"/>
</svg>
