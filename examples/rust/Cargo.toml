[package]
name = "epic-examples"
version = "0.1.0"
edition = "2021"
publish = false
description = "Client examples for the Epic Cash developer documentation"

# Pinned so the published snippets keep compiling. Bump deliberately, then rebuild.
[dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.100"
base64 = "0.22.1"
dirs = "5.0.1"
hex = "0.4.3"
rand = "0.8.5"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
secp256k1 = { version = "0.29.1", features = ["rand-std"] }
serde_json = "1.0.145"

[[bin]]
name = "node-status"
path = "src/bin/node_status.rs"

[[bin]]
name = "wallet-balance"
path = "src/bin/wallet_balance.rs"
