# nginx server block for the Epic developer documentation.
#
# The site is a static build: no application server, no database, nothing to keep alive. Copy the
# build output into place and reload. Include this from /etc/nginx/sites-enabled/ or paste the
# server block into your existing configuration.
#
# Deliberately not here: anything that proxies to another machine, and anything that accepts a
# request body. Adding either is a decision with a threat model attached, so it belongs in its own
# file and its own review rather than arriving as a side effect of publishing docs.

server {
    listen 80;
    listen [::]:80;
    server_name devdocs.epiccash.com;

    # Certbot writes into this and everything else goes to TLS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name devdocs.epiccash.com;

    ssl_certificate     /etc/letsencrypt/live/devdocs.epiccash.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devdocs.epiccash.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/epic-devhub;
    index index.html;

    # The docs are read-only public content, so the interesting headers are the ones that limit
    # what a compromised page could do rather than anything about credentials.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # No inline script is used by the build except Docusaurus's own hydration bootstrap, which is
    # why 'unsafe-inline' is present for script-src. Tighten it only after checking the build, not
    # on principle: a CSP that breaks hydration turns every page into a blank screen.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    # Hashed assets can be cached hard, because a content change changes the filename.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # The offline search index is one large file and is not content-hashed, so it revalidates.
    location = /search-index.json {
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    # The documentation assistant is not proxied here yet. The service is developed separately and
    # is not part of this repository.
    #
    # When it is added, scope it to /api/chat and never to /api/. The documentation has its own
    # /api/ section, 16 reference pages under /api/authentication, /api/node/*, /api/wallet/*, and a
    # `location /api/` would send every one of them to the assistant and return JSON. That exact
    # mistake was in the assistant's own static handler and hid all 16 pages from the single-origin
    # preview until 2026-08-25. The three routes it owns are:
    #
    #     GET  /api/chat/challenge
    #     POST /api/chat/session
    #     POST /api/chat
    #
    # all covered by the /api/chat prefix. Answers are server-sent events, so that block needs
    # `proxy_buffering off;` or the whole answer arrives in one lump at the end.

    # Docusaurus emits a directory per route with an index.html inside, so a trailing-slash-less
    # request has to fall through to the directory before the 404 page.
    #
    # The last fallback is `=404`, not `/404.html`. Falling back to the file directly serves the
    # not-found page with a 200, so a crawler, a link checker and `curl -I` all believe the URL
    # exists. `=404` raises a real 404 and error_page below serves the same page with the right
    # status.
    location / {
        try_files $uri $uri/ $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
