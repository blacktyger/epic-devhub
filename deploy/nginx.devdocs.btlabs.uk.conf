# nginx server block for devdocs.btlabs.uk — the Epic Cash developer documentation.
#
# Derived from deploy/nginx.conf, with three deliberate differences from that committed template:
#
#   1. server_name is devdocs.btlabs.uk, and the certificate paths follow it.
#   2. http2 is a listen flag, not the `http2 on;` directive. This box runs nginx 1.24.0, and the
#      per-server directive arrived in 1.25.1, so the template's form is a config error here.
#   3. The ACME webroot is /var/www/html, which is where the three certificates already on this
#      box (btlabs.uk, node.btlabs.uk, wallet.btlabs.uk) renew from. One webroot for the host
#      rather than a second one that only this vhost knows about.
#
# Serving three locales is the reason several blocks below are regex rather than prefix matches.
# `docusaurus build` emits a complete site per locale: the default locale at the root, and ru/ and
# zh-CN/ each with their own assets/, fonts/ and search-index.json. A plain `location /assets/`
# therefore caches English assets for a year and leaves the other two locales revalidating every
# asset on every page. The locale set is written out here because nginx has no way to read
# site/src/locales.js; adding a locale to that file means adding it to the alternation below.

# Which not-found page a failed request gets. Each locale build ships its own 404, and serving the
# English one for a Russian URL is a language switch the reader did not ask for. A `map` is the only
# way to choose it: `error_page` takes one static argument per server block, and `if` inside a
# location cannot set it. This sits at http context, which is where an included sites-enabled file
# already is, and evaluates lazily — no cost on a request that finds its file.
map $uri $epic_devhub_404 {
    default    /404.html;
    ~^/ru/     /ru/404.html;
    ~^/zh-CN/  /zh-CN/404.html;
}

server {
    listen 80;
    listen [::]:80;
    server_name devdocs.btlabs.uk;

    # Certbot writes into this and everything else goes to TLS. Plain HTTP on purpose: a renewal
    # must never depend on the certificate it is renewing.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name devdocs.btlabs.uk;

    ssl_certificate     /etc/letsencrypt/live/devdocs.btlabs.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devdocs.btlabs.uk/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/epic-devhub;
    index index.html;

    # The docs are read-only public content, so the interesting headers are the ones that limit
    # what a compromised page could do rather than anything about credentials.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # 'unsafe-inline' for script-src is Docusaurus's inline hydration bootstrap. Tighten only after
    # checking a real build: a CSP that blocks hydration turns every page into a blank screen.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    # Hashed assets can be cached hard, because a content change changes the filename. Matched for
    # every locale root, not just the default one.
    location ~ ^/(?:(?:ru|zh-CN)/)?assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location ~ ^/(?:(?:ru|zh-CN)/)?fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # The offline search index is one large file per locale and is not content-hashed, so it
    # revalidates. Three files, one rule.
    location ~ ^/(?:(?:ru|zh-CN)/)?search-index\.json$ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    # The documentation assistant, epic-assistant on 127.0.0.1:6660 under pm2.
    #
    # Scoped to /api/chat and never to /api/. The documentation has its own /api/ section — 16
    # reference pages under /api/authentication, /api/node/*, /api/wallet/*, and their ru/ and zh-CN/
    # counterparts, 48 pages in all — and a `location /api/` returns JSON for every one of them. That
    # exact mistake was in the assistant's own static handler and hid all 16 English pages from the
    # single-origin preview until 2026-08-25.
    #
    # The three routes this prefix covers:
    #     GET  /api/chat/challenge
    #     POST /api/chat/session
    #     POST /api/chat
    #
    # The admin routes are deliberately not proxied. They live on the same port but reachable from
    # this box only, so the token that gates them is the second lock rather than the only one.
    location /api/chat {
        proxy_pass http://127.0.0.1:6660;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The service reads Origin to reject a request driven from someone else's page. Rewriting or
        # dropping it here would turn that check into a check on nginx.
        proxy_set_header Origin $http_origin;
        proxy_set_header Connection "";

        # Answers are server-sent events. Without this the whole answer buffers in nginx and arrives
        # in one lump at the end, which reads as a hang for the twenty seconds it takes to generate.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        # gzip on an SSE stream is the same failure by another route: nginx holds bytes back waiting
        # for a compressible block.
        gzip off;

        # A long answer streams for well over a minute, and the default 60s read timeout truncates it
        # mid-sentence with no error the panel can distinguish from a finished answer.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # POST /api/chat/session and /api/chat carry a question and a short history, not an upload.
        client_max_body_size 128k;

        # This is the one route on the vhost that costs money per request, so it gets its own log.
        access_log /var/log/nginx/epic-devhub-assistant.log;
    }

    # Docusaurus emits a directory per route with an index.html inside, so a trailing-slash-less
    # request has to fall through to the directory before the 404 page.
    #
    # The last fallback is `=404`, not `/404.html`. Falling back to the file directly serves the
    # not-found page with a 200, so a crawler, a link checker and `curl -I` all believe the URL
    # exists. `=404` raises a real 404 and error_page below serves the same page with the right
    # status.
    location / {
        try_files $uri $uri/ $uri.html $uri/index.html =404;
    }

    # Each locale ships its own 404 page; $epic_devhub_404 above picks the one matching the prefix.
    # `internal` keeps them reachable only by this internal redirect, so /404.html is not itself a
    # publicly addressable page that answers 200.
    error_page 404 $epic_devhub_404;
    location ~ ^/(?:(?:ru|zh-CN)/)?404\.html$ {
        internal;
    }
}
